services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sentiment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head
      && uvicorn app:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:

